<!DOCTYPE html>
<html lang="en" class="h-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body class="d-flex flex-column h-100">
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-md">
                <a class="navbar-brand" href="#">Horaire</a>
            </div>
        </nav>
    </header>

    <main class="container d-flex justify-content-center align-items-center flex-grow-1 my-4">
<div class="col-md-6 col-lg-4 p-4 shadow rounded bg-light">
    <h2 class="mb-4 text-center">Ajouter</h2>
    <form>
        
        <div class="mb-3">
            <label for="classe" class="form-label">Classe</label>
            <select id="classe" class="form-select" aria-label="Sélectionner la classe">
                <option selected disabled>Choisir une classe</option>
            </select>
        </div>

        
        <div class="mb-3">
            <label for="cours" class="form-label">Cours</label>
            <select id="cours" class="form-select" aria-label="Sélectionner le cours">
                <option selected disabled>Choisir un cours</option>
            </select>
        </div>

        
        <div class="mb-3">
            <label for="jour" class="form-label">Jour</label>
            <select id="jour" class="form-select" aria-label="Sélectionner le jour">
                <option selected disabled>Choisir un jour</option>
                <option value="lundi">Lundi</option>
                <option value="mardi">Mardi</option>
                <option value="mercredi">Mercredi</option>
                <option value="jeudi">Jeudi</option>
                <option value="vendredi">Vendredi</option>
            </select>
        </div>

        
        <div class="mb-3">
            <label for="salle" class="form-label">Salle (Numéro)</label>
            <input type="number" class="form-control" id="salle" step="1" placeholder="Ex: 102" required>
        </div>

        
        <div class="mb-3">
            <label for="heureDebut" class="form-label">Heure de début</label>
            <input type="time" class="form-control" id="heureDebut" required>
        </div>
        
        
        <div class="mb-3">
            <label for="heureFin" class="form-label">Heure de fin</label>
            <input type="time" class="form-control" id="heureFin" required>
        </div>

        
        <button type="submit" class="btn btn-primary w-100">Ajouter</button>
    </form>
</div>
    </main>

    <footer class="bg-white text-black text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Theo Hottelier - Tous droits réservés.</p>
        </div>
    </footer>
    <script type="module" src="js/ajouter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
